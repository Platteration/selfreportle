# Selfreportle, the website: nginx server blocks. Include this file from the http {} block (for
# example from /etc/nginx/conf.d/), then set server_name, root and the certificate paths.
# Netlify and Cloudflare Pages read _headers instead; Apache: .htaccess. The headers are the
# same in all three and in the pages' <meta>, and test/website.test.js holds them equal. This
# block serves the site at the domain's root; for a sub-path, put the path in front of every
# location below and of the error page.
#
# The site's API (sign in with Google and "Support this app": server/start.mjs, see README.md,
# "The website") is proxied from `location ^~ /api/` below; without that process running, /api/
# answers as a site with no API (the folder's api/config, "nothing on", and the not-found page),
# and the page draws no sign-in and no shop. A server that never runs the API can delete that
# location and @api-off: the allowlist then serves the folder's api/config.
#
# `listen 443 ssl http2` is the form nginx 1.22 and 1.24 load (1.24 is what Ubuntu 24.04 ships);
# `http2 on;` is 1.25.1 and later, and an older nginx refuses the whole file over it. From 1.25.1
# this form loads with a warning that it is deprecated. test/e2e/hosts.js loads this file into a
# real nginx.

server {
  listen 80;
  listen [::]:80;
  server_name example.com;
  server_tokens off;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name example.com;

  # The folder `node scripts/build-site.js /var/www/selfreportle --host=nginx` writes: the site
  # and nothing else. Never point root at a git checkout; the allowlist below is the second line.
  root /var/www/selfreportle;
  index index.html;

  ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

  server_tokens off;
  autoindex off;
  charset utf-8;

  # a missing page, a folder and a refused file all show the site's own not-found page
  error_page 403 404 =404 /404.html;

  # The site's own files and nothing else: the extension's other scripts, the API's code, the
  # repository's notes and tests, dotfiles (.git above all) and folders all answer 404. The
  # pattern is .htaccess's, api/config included, which this location never sees while the API's
  # location below is there: everything under /api/ goes to the API, or to @api-off while it is down.
  location = / {
    try_files /index.html =404;
  }
  location ~ ^/(index\.html|404\.html|app\.js|account\.js|guard\.js|site\.css|robots\.txt|LICENSE|icons/icon32\.png|\.well-known/security\.txt|api/config|lib/(model-catalog|research|lexicons|signals|verdicts|text-analyzer|site-analyzer|image-hints|legitimacy|attribution|cbor|x509|c2pa-verify|image-metadata)\.js)$ {
    try_files $uri =404;
  }
  location / {
    return 404;
  }
  # The site's API, on the site's own origin: server/start.mjs, listening on 127.0.0.1:8788. It is
  # off until its variables are set, and with the process not running /api/ answers as a site with
  # no API does (@api-off below); either way the page then draws no sign-in and no shop. ^~ wins
  # over the regular expression above, so nothing under /api/ is served from the folder or refused
  # here while the API answers; proxy_pass has no URI, so the path reaches the API unchanged.
  location ^~ /api/ {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    client_max_body_size 1m;
    proxy_read_timeout 30s;
    # One add_header here means none of the server block's is inherited, so the API's own headers
    # (server/kit) go out alone. This repeats the server block's Strict-Transport-Security line as
    # it is written there; test/website.test.js holds the two equal.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # With the API process not running (or not answering within proxy_read_timeout), nginx's own
    # 502, 503 or 504 is answered by @api-off below, where it went out as nginx's error page with
    # HSTS alone. These are nginx's errors only: whatever the API itself answers goes out as it is
    # (proxy_intercept_errors stays off). recursive_error_pages lets the not-found page follow.
    error_page 502 503 504 = @api-off;
    recursive_error_pages on;
  }
  # The folder's api/config ("nothing on", 200) at that address and the site's not-found page at
  # every other, with the server block's headers, which a location with no add_header inherits.
  location @api-off {
    default_type application/json;
    try_files $uri =404;
  }
  # the licence has no extension; serve it as text rather than a download
  location = /LICENSE {
    default_type text/plain;
    try_files $uri =404;
  }

  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; require-trusted-types-for 'script'; trusted-types selfreportle-saved-page; frame-ancestors 'none'; upgrade-insecure-requests" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), clipboard-read=(), clipboard-write=(), display-capture=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), identity-credentials-get=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), otp-credentials=(), payment=(), picture-in-picture=(), publickey-credentials-create=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), storage-access=(), usb=(), window-management=(), xr-spatial-tracking=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # no file name carries a version: revalidate every load (an unchanged file is a 304)
  add_header Cache-Control "no-cache" always;
}
