name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # Weekly, for a tree nobody pushes to: GitHub runs a schedule from the default branch
  # only, where an advisory or a build that has rotted then shows within a week. Not at
  # the top of the hour, a high-load time when scheduled runs can be delayed or dropped
  # (CONVENTIONS.md, "CI").
  schedule:
    - cron: "17 6 * * 1"

# A newer run for the same ref supersedes an in-flight one. On the default branch the
# weekly run shares the group with pushes; whichever is cancelled, the other tests the
# branch's newest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - run: npm run lint

      - run: npm test

      - run: npm run test:conventions

      # The extension has no dependencies and no lockfile, so Playwright is pinned here and
      # installed for this job only, without touching package.json. --ignore-scripts because
      # the only install script in that tree is skipped today by a field the package itself
      # controls (fsevents' `os: ["darwin"]`), which is not a decision to delegate.
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
